<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧 - タスク管理システム</title>
    <link th:href="@{/style.css}" rel="stylesheet">
    <style>
        .filter-link-btn, .category-link-btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-link-btn.inactive, .category-link-btn.inactive {
            background-color: white;
            color: #4a5568;
            border: 1px solid #cbd5e0;
        }
        .category-link-btn.inactive {
            background-color: #edf2f7;
            color: #4a5568;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
        }
        .link-btn-active {
            background-color: #1a365d !important;
            color: white !important;
            border: none !important;
        }
        .category-link-btn.inactive:hover { background-color: #e2e8f0; }
        .action-link { text-decoration: none !important; display: inline-block; }
    </style>
</head>
<body>

	<!-- ヘッダーエリア（ボタン単体リンク化でクリック誤作動を完全防止） -->
	    <div class="header-container">
	        <h1>タスク一覧</h1>
	        <div class="user-info">
	            <span>ようこそ、<span class="user-name">test_user</span> さん</span>
	            
	            <!-- ★ここを書き換え：aタグ単体でダッシュボードへ安全に飛ばします -->
	            <a th:href="@{/dashboard}" class="header-btn btn-dashboard" style="text-decoration: none; line-height: 24px; display: inline-block; text-align: center;">
	                ダッシュボード
	            </a>
	            
	            <a th:href="@{/logout}" onclick="return confirm('ログアウトしてよろしいですか？');" style="text-decoration: none;">
	                <button class="header-btn btn-logout">ログアウト</button>
	            </a>
	        </div>
	    </div>

    <!-- 複製アラートメッセージ -->
    <div style="background-color: #e6fffa; border: 1px solid #b2f5ea; color: #234e52; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; font-weight: bold;" 
         th:if="${successMessage}" th:text="${successMessage}">
        タスクを複製しました
    </div>

    <!-- メインの白いカード枠 -->
    <div class="main-card">
        <!-- 検索ボックスエリア -->
        <form th:action="@{/tasks}" method="get" class="search-container" style="display: flex; flex: 1; gap: 10px; width: 100%;">
            <input type="hidden" name="favoriteOnly" th:value="${favoriteOnly}">
            <input type="hidden" name="categoryName" th:value="${selectedCategory}">
            <input type="hidden" name="sortOrder" th:value="${sortOrder}">
            <input type="text" name="keyword" th:value="${keyword}" class="search-input" placeholder="タスク名で検索">
            <button type="submit" class="btn-search">検索</button>
        </form>

		<!-- 切り替えボタンエリア（すべて表示でお気に入りも検索も全クリア、お気に入りのみボタンも完全復活！） -->
		<div class="filter-container">
		    <!-- 1. すべて表示ボタン（検索キーワード、お気に入り、カテゴリを全部リセットします） -->
		    <a th:href="@{/tasks(keyword='', favoriteOnly=false, categoryName='', sortOrder=${sortOrder})}"
		       class="filter-link-btn" th:classappend="${!favoriteOnly} ? 'link-btn-active' : 'inactive'">すべて表示</a>
		    
		    <!-- 2. ★お気に入りのみボタン（消えていたボタンをここに復活させました！） -->
		    <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=true, categoryName=${selectedCategory}, sortOrder=${sortOrder})}"
		       class="filter-link-btn" th:classappend="${favoriteOnly} ? 'link-btn-active' : 'inactive'">★ お気に入りのみ</a>
		</div>


        <!-- カテゴリ切り替えエリア -->
        <div class="category-container">
            <span class="category-label">カテゴリ:</span>
            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName='プライベート', sortOrder=${sortOrder})}"
               class="category-link-btn" th:classappend="${selectedCategory == 'プライベート'} ? 'link-btn-active' : 'inactive'"
               th:text="'プライベート (' + ${privateCount} + ')'">プライベート (0)</a>
            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName='仕事', sortOrder=${sortOrder})}"
               class="category-link-btn" th:classappend="${selectedCategory == '仕事'} ? 'link-btn-active' : 'inactive'"
               th:text="'仕事 (' + ${workCount} + ')'">仕事 (0)</a>
            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName='勉強', sortOrder=${sortOrder})}"
               class="category-link-btn" th:classappend="${selectedCategory == '勉強'} ? 'link-btn-active' : 'inactive'"
               th:text="'勉強 (' + ${studyCount} + ')'">勉強 (0)</a>
            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName='', sortOrder=${sortOrder})}"
               th:if="${selectedCategory != null && selectedCategory != ''}" class="category-link-btn inactive">すべて</a>
        </div>

        <!-- 並び替えエリア -->
        <div class="sort-container">
            <span class="sort-label">並び替え:</span>
            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName=${selectedCategory != null ? selectedCategory : ''}, sortOrder='newest')}" 
               class="sort-link" th:classappend="${sortOrder == 'newest' || sortOrder == null || sortOrder == ''} ? 'active' : ''">新着順</a> | 
            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName=${selectedCategory != null ? selectedCategory : ''}, sortOrder='oldest')}" 
               class="sort-link" th:classappend="${sortOrder == 'oldest'} ? 'active' : ''">古い順</a>
        </div>
    </div>

    <!-- 動的な件数表示エリア -->
    <div class="info-text" th:if="${totalTasks > 0}"
         th:text="'全' + ${totalTasks} + '件中 ' + ${startTaskNum} + '-' + ${endTaskNum} + '件目を表示 (' + (${currentPage} + 1) + '/' + ${totalPages} + 'ページ)'">
        全0件中 0-0件目を表示 (1/1ページ)
    </div>
    <div class="info-text" th:if="${totalTasks == 0}">該当するタスクはありません。</div>

    <!-- タスク一覧の表エリア -->
    <table class="task-table">
        <thead>
            <tr>
                <th style="width: 80px;">お気に入り</th>
                <th style="width: 50px;">ID</th>
                <th>タイトル</th>
                <th style="width: 120px;">カテゴリ</th>
                <th style="width: 100px;">ステータス</th>
                <th style="width: 80px;">優先度</th>
                <th style="width: 160px;">作成日時</th>
                <th style="width: 180px;">操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}" th:classappend="${task.isFavorite == 1} ? 'row-fav'">
                <td style="text-align: center;">
                    <a th:href="@{/tasks/toggle-favorite/{id}(id=${task.id})}" class="star-link">
                        <span th:if="${task.isFavorite == 1}" class="star-active">★</span>
                        <span th:if="${task.isFavorite != 1}" class="star-inactive">★</span>
                    </a>
                </td>
                <td th:text="${task.id}">1</td>
                <td><strong th:text="${task.title}">タスク名</strong></td>
                <td><span th:text="${task.category}" class="badge" th:classappend="${task.category == '仕事'} ? 'badge-work' : (${task.category == '勉強'} ? 'badge-study' : 'badge-private')"></span></td>
                <td><span th:text="${task.status}" class="badge" th:classappend="${task.status == '進行中'} ? 'badge-progress' : (${task.status == '完了'} ? 'badge-done' : 'badge-todo')"></span></td>
                <td><span th:text="${task.priority}" class="badge" th:classappend="${task.priority == '高'} ? 'badge-high' : (${task.priority == '中'} ? 'badge-mid' : 'badge-low')"></span></td>
                <td th:text="${#temporals.format(task.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-01 12:30</td>
                <td>
                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}" class="action-link"><button class="action-btn btn-edit">編集</button></a>
                    <a th:href="@{/tasks/copy/{id}(id=${task.id})}" class="action-link" th:onclick="return confirm([[${task.title}]] + 'を複製しますか？');"><button class="action-btn btn-copy">複製</button></a>
                    <a th:href="@{/tasks/delete/{id}(id=${task.id})}" class="action-link" onclick="return confirm('本当にこのタスクを削除してもよろしいですか？');"><button class="action-btn btn-delete">削除</button></a>
                </td>
            </tr>
        </tbody>
    </table>
	<!-- ページネーションエリア（ここから後半です） -->
	    <div class="pagination" th:if="${totalPages > 1}">
	        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
	            <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName=${selectedCategory}, sortOrder=${sortOrder}, page=${i})}"
	               class="page-link" th:classappend="${i == currentPage} ? 'active' : ''" th:text="${i + 1}">1</a>
	        </th:block>
	        <a th:href="@{/tasks(keyword=${keyword}, favoriteOnly=${favoriteOnly}, categoryName=${selectedCategory}, sortOrder=${sortOrder}, page=${currentPage + 1})}"
	           class="page-link" th:if="${currentPage < totalPages - 1}">次へ »</a>
	    </div>

	    <!-- 新規作成ボタン -->
	    <div class="create-container">
	        <a th:href="@{/tasks/create}"><button class="btn-create">＋ 新規作成</button></a>
	    </div>

 </body>
	
 </html>
